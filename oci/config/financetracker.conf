server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Coarse edge throttle for public auth endpoints (bots / floods).
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# Flex Street subdomain is a distinct origin (see oci/README.md). Serve its
# SEO document at / without redirecting to www.
map $host $landing_index {
    default                     /index.html;
    flexstreet.dhanshanti.com   /flexstreet/index.html;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/pki/nginx/financetracker.crt;
    ssl_certificate_key /etc/pki/nginx/private/financetracker.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 10m;

    root /var/www/financetracker;
    index index.html;

    location = / {
        try_files $landing_index =404;
    }

    location = /flexstreet {
        try_files /flexstreet/index.html =404;
    }

    location = /flexstreet/ {
        try_files /flexstreet/index.html =404;
    }

    # Avoid Cloudflare/browser caching stale Flutter builds.
    location ~* \.(js|json|html)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
