name: finance_tracker
description: Personal finance tracking app for stocks and mutual funds
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.1.1
  fl_chart: ^0.66.0
  intl: ^0.18.1
  file_picker: ^8.0.0
  csv: ^6.0.0
  excel_community: ^2.1.8
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
